[project]
name = "matchplay-score"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arborelia", email = "gh@arborelia.net" }
]
requires-python = ">=3.14"
dependencies = [
    "cachetools>=7.2.8",
    "flask>=3.1.3",
    "requests>=2.34.2",
    "waitress>=3.0.2",
]

[project.scripts]
matchplay-score = "matchplay_score:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ipython",
]

[tool.vercel]
entrypoint = "src.matchplay_score.web:app"