name: Publish ScoreHigh

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.14'
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --group dev
      - name: Check source and scoring
        run: |
          uv run ruff check src tests tools
          uv run pytest
      - name: Build score snapshot
        run: uv run --no-dev python -m matchplay_score.export --output _site --base-path /scorehigh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
